services:
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/_explorer/emulator.pem"]
      interval: 30s
      retries: 3

  webapp:
    build: ./IACSFWebApp
    ports:
      - "5000:5000"
    depends_on:
      - cosmos-emulator
    environment:
      CosmosDb__Endpoint: "https://cosmos-emulator:8081"
      CosmosDb__Key: "C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==;"

alerts:
  - name: CosmosHealth
    service: cosmos-emulator
    condition: "unhealthy"
    action: "notify"
  - name: WebAppHealth
    service: webapp
    condition: "unhealthy"
    action: "notify"
