name: CI

on:
  push:
    branches:
      - main
      - "releases/**"
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r agents/requirements.txt || true
          pip install -r web-app/backend/requirements.txt || true
      - name: Run pytest
        run: pytest -q || true
      - name: Run main.py
        run:  python web-app/backend/main.py || true
        port:  
        - 5000:5000|| true
        environment:
        - COSMOSDB_URI=https://cosmosdbemulator:8081
        - COSMOSDB_KEY=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+...==
        - FOUNDRY_URL=http://foundry-local:7000
        depends_on:
        - cosmosdbemulator
        - foundry-local
  docker-smoke:
    runs-on: ubuntu-latest
    needs: [test]
    services:
      docker:
        image: docker:24-dind
        options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose up
        run: |
          cd data-integration || exit 0
          docker-compose up -d || true
          sleep 10
          docker-compose ps || true

  aspire-integration:
    runs-on: ubuntu-latest
    needs: [docker-smoke]
    steps:
      - uses: actions/checkout@v4

      # Setup .NET for Aspire
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Install Aspire CLI
        run: dotnet tool install --global Microsoft.Aspire.Cli

      # Run Aspire orchestration (Python app + ServiceDefaults + Cosmos Emulator)
      - name: Run Aspire services
        run: aspire up --file Aspire.yml --non-interactive & sleep 30

      # Run Python integration tests against Cosmos DB Emulator
      - name: Cosmos DB Integration Test
        run: |
          pip install azure-cosmos>=4.5.0
          python tests/test_cosmos_integration.py
