name: CI

on:
  push:
    branches:
      - main
      - "releases/**"
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r agents/requirements.txt || true
          pip install -r web-app/backend/requirements.txt || true
      - name: Run pytest
        run: pytest -q || true

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [test]
    services:
      docker:
        image: docker:24-dind
        options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Docker Compose up
        run: |
          cd data-integration || exit 0
          docker-compose up -d || true
          sleep 10
          docker-compose ps || true

  aspire-integration:
    runs-on: ubuntu-latest
    needs: [docker-smoke]
    steps:
      - uses: actions/checkout@v4

      # Setup .NET for Aspire
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Install Aspire CLI
        run: dotnet tool install --global Microsoft.Aspire.Cli

      # Run Aspire orchestration (calls Aspire.yml)
      - name: Run Aspire services
        run: aspire up --file Aspire.yml --non-interactive & sleep 30

      # Run Python integration tests against Cosmos DB Emulator + Foundry-local
      - name: Cosmos DB Integration Test
        run: |
          pip install azure-cosmos>=4.5.0 httpx
          python tests/test_cosmos_integration.py
      - name: Foundry-local Integration Test
        run: |
          python tests/test_foundry_integration.py
      - name: Combined Integration Test
        run: pytest tests/test_integration.py -q
