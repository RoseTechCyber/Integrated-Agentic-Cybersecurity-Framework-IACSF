version: "1.0"

services:
  python-app:
    image: python:3.11
    command:  ["python", "runner.py"]
    ports:
      - 5000:5000
    environment:
      - COSMOSDB_URI=https://cosmosdbemulator:8081
      - COSMOSDB_KEY=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+...==
      - FOUNDRY_URL=http://foundry-local:7000
    depends_on:
      - cosmosdbemulator
      - foundry-local

  aspire-service-defaults:
    build:
      context: ./IACSF/IACSF.ServiceDefaults
    project: Aspire.ServiceDefaults.csproj
    ports:
      - 8080:8080

  cosmosdbemulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    ports:
      - 8081:8081
      - 10250:10250
      - 10251:10251
      - 10252:10252
      - 10253:10253
      - 10254:10254
    environment:
      - AZURE_COSMOS_EMULATOR_PARTITION_COUNT=3
      - AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=true

  foundry-local:
    image: my-foundry-local:latest
    ports:
      - 7000:7000
