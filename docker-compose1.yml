version: '3.8'
services:
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    ports:
      - "8081:8081"
      - "10250-10254:10250-10254"
    privileged: true

  webapp:
    build: ./IACSFWebApp
    ports:
      - "5000:5000"
    environment:
      CosmosDb__Endpoint: "${COSMOS_ENDPOINT}"
      CosmosDb__Key: "${COSMOS_PRIMARY_KEY}"
    depends_on:
      - cosmos-emulator