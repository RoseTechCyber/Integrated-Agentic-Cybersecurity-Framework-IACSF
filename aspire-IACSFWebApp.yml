services:
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    ports:
      - "8081:8081"
      - "10250-10254:10250-10254"
    options: --privileged

  reasoning-agent:
    build: ./web-app/backend
    command: uvicorn main:app --host 0.0.0.0 --port 6000
    ports:
      - "6000:6000"
    depends_on:
      - cosmos-emulator
    environment:
      CosmosDb__Endpoint: "https://cosmosdbemulator:8081/"
      CosmosDb__PrimaryKey: "C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==;"
      DataFile: "data/frameworks/iso27001_controls.json"

name: Build and Deploy WebApp

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      cosmos-emulator:
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator
        ports:
          - 8081:8081
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore IACSFWebApp/IACSFWebApp.csproj

      - name: Build WebApp
        run: dotnet build IACSFWebApp/IACSFWebApp.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test IACSFWebApp/IACSFWebApp.csproj --no-build --verbosity normal

      - name: Publish WebApp
        run: dotnet publish IACSFWebApp/IACSFWebApp.csproj -c Release -o out

      - name: Deploy to Foundry
        run: | image: my-foundry-local:latest
    ports:
      - 7000:7000
     echo "Deploying WebApp to Foundry..."
    # Replace with Foundry CLI or API deployment command
