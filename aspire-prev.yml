services:
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    ports:
      - "8081:8081"
      - "10250-10254:10250-10254"
    options: --privileged

  reasoning-agent:
    build: ./web-app/backend
    command: uvicorn main:app --host 0.0.0.0 --port 6000
    ports:
      - "6000:6000"
    depends_on:
      - cosmos-emulator
    environment:
      CosmosDb__Endpoint: "https://cosmosdbemulator:8081/"
      CosmosDb__PrimaryKey: "C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==;"
      DataFile: "data/frameworks/iso27001_controls.json"
