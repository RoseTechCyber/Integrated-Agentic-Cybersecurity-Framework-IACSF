name: CI Pipeline
on:
  push:
    branches:
      - main
workflow_dispatch:
    branches:
      - main
jobs:
  # Step 1: Build and test your .NET solution
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      - uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Build & Test
        run: |
          dotnet restore IACSF.slnx
          dotnet build IACSF.slnx --configuration Release
          dotnet test IACSF.slnx --no-build
          dotnet restore IACSFWebApp.slnx
          dotnet build IACSFWebApp.slnx --configuration Release
          dotnet test IACSFWebApp.slnx --no-build
          dotnet restore IACSFApp.slnx
          dotnet build IACSFApp.slnx --configuration Release
          dotnet test IACSFApp.slnx --no-build
 # Step 2: Build local Docker images and run integration with Compose
  docker-compose-integration:
    needs: [build-test-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v2
      - uses: docker/setup-qemu-action@v2
      - uses: docker/setup-compose-action@v2

      # Build Foundry Service image
      - name: Build Foundry Service image
        run: docker build -t foundry-service:latest ./IACSFWebApp

      # Build Reasoning Agent hosting image
      - name: Build Reasoning Agent image
        run: docker build -t reasoning-agent:latest ./IACSFApp

      # Write docker-compose.override.yml
      - name: Write docker-compose.override.yml
        run: |
          cat > docker-compose.override.yml <<'EOF'
          version: "3.9"
          services:
            cosmosdbemulator:
              image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
              ports:
                - "8081:8081"
                - "10250-10254:10250-10254"
              privileged: true

            foundry:
              image: foundry-service:latest
              ports:
                - "8080:8080"

            reasoning-agent:
              image: reasoning-agent:latest
              ports:
                - "9090:9090"
              depends_on:
                - cosmosdbemulator
                - foundry
          EOF

      - name: Build and start services
        run: docker compose -f docker-compose.override.yml up -d --build

      - name: Wait for Cosmos DB Emulator
        run: |
          for i in {1..30}; do
            curl -k https://localhost:8081/_explorer/emulator.pem && echo "Cosmos DB Emulator is ready!" && break
            sleep 2
          done

      - name: Wait for Foundry
        run: |
          for i in {1..30}; do
            curl -s http://localhost:8080/status && echo "Foundry is ready!" && break
            sleep 2
          done

      - name: Wait for Reasoning Agent
        run: |
          for i in {1..30}; do
            curl -s http://localhost:9090/status && echo "Reasoning Agent is ready!" && break
            sleep 2
          done
    
  # Step 3: Run Aspire integration workflow
  aspire-integration:
    needs: [docker-compose-integration]
    uses: ./.github/workflows/aspire.yml

  # Step 4: Tear down services
  docker-teardown:
    needs: [aspire-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-compose-action@v2
      - name: Tear down services
        run: docker compose -f docker-compose.override.yml down
