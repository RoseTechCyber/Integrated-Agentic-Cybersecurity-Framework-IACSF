name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      - uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Build & Test
        run: |
          dotnet restore IACSF.slnx
          dotnet build IACSF.slnx --configuration Release
          dotnet test IACSF.slnx --no-build

  docker-compose-integration:
    needs: [build-test-publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v2
      - uses: docker/setup-qemu-action@v2
      - uses: docker/setup-compose-action@v2

      - name: Define services inline
        run: |
          cat > docker-compose.override.yml <<'EOF'
          version: "3.9"
          services:
            cosmosdbemulator:
              image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
              ports:
                - "8081:8081"
                - "10250-10254:10250-10254"
              privileged: true

            foundry:
            image: your-foundry-image:latest
            ports:
                - "5280:5280"
           UseLocalService: true
              
           reasoning-agent:
              build:
                context: ./web-app/backend
                dockerfile: Dockerfile
              ports:
                - "5000:5000"
              depends_on:
                - cosmosdbemulator
                - foundry
          EOF

      - name: Build and start services
        run: docker compose -f docker-compose.override.yml up -d --build

      - name: Wait for Cosmos DB Emulator
        run: |
          for i in {1..30}; do
            curl -k https://localhost:8081/_explorer/emulator.pem && echo "Cosmos DB Emulator is ready!" && break
            sleep 2
          done

      - name: Wait for Foundry
        run: |
          for i in {1..30}; do
            curl -s http://localhost:5280/status && echo "Foundry is ready!" && break
            sleep 2
          done

      - name: Run integration tests
        run: pytest tests/test_integration.py -q

  aspire-integration:
    needs: [docker-compose-integration]
    uses: ./.github/workflows/aspire.yml

  docker-teardown:
    needs: [aspire-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-compose-action@v2
      - name: Tear down services
        run: docker compose -f docker-compose.override.yml down
