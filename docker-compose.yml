version: "3.9"

services:
  cosmosdbemulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    ports:
      - "8081:8081"
      - "10250-10254:10250-10254"
    privileged: true

  foundry:
    image: your-foundry-image:latest
    ports:
      - "8080:8080"

  reasoning-agent:
    build:
      context: ./web-app/backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - cosmosdbemulator
      - foundry
